services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.1
    container_name: elasticsearch
    environment:
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - 9200:9200
      - 9300:9300
    volumes:
      - ../elasticsearch-data:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs
      - ./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    networks:
      - elastic
    command: >
      /bin/bash -c "
        elasticsearch-plugin install --batch analysis-nori;
        /usr/local/bin/docker-entrypoint.sh elasticsearch
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert /usr/share/elasticsearch/config/certs/elasticsearch.crt -u ${ELASTICSEARCH_USERNAME}:${ELASTIC_PASSWORD} https://${DNS_NAME}:9200 -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  setup_elasticsearch:
    image: curlimages/curl:latest
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      sh -c '
        curl -k --cacert /certs/elasticsearch.crt -u ${ELASTICSEARCH_USERNAME}:${ELASTIC_PASSWORD} -X PUT "https://${DNS_NAME}:9200/article_infos?pretty" -H "Content-Type: application/json" -d "{
          \"settings\": {
            \"index\": {
              \"number_of_shards\": 1,
              \"number_of_replicas\": 0,
              \"sort.field\": \"pub_date\",
              \"sort.order\": \"desc\"
            },
            \"analysis\": {
              \"analyzer\": {
                \"my_nori_analyzer\": {
                  \"type\": \"custom\",
                  \"tokenizer\": \"nori_tokenizer\",
                  \"filter\": [
                    \"lowercase\",
                    \"trim\",
                    \"my_stop\",
                    \"my_synonym_filter\"
                  ]
                }
              },
              \"tokenizer\": {
                \"nori_tokenizer\": {
                  \"type\": \"nori_tokenizer\",
                  \"decompound_mode\": \"mixed\"
                }
              },
              \"filter\": {
                \"my_stop\": {
                  \"type\": \"stop\",
                  \"stopwords\": [\"_korean_\", \"은\", \"는\", \"이\", \"가\"]
                },
                \"my_synonym_filter\": {
                  \"type\": \"synonym\",
                  \"synonyms\": [
                    \"카프카, kafka\",
                    \"쿠버네티스, k8s, kubernetes\",
                    \"도커, docker\",
                    \"마이크로서비스, msa, microservices\",
                    \"테스트, test\",
                    \"동시성, concurrency\"
                  ]
                }
              }
            }
          },
          \"mappings\": {
            \"properties\": {
              \"id\": {\"type\":\"keyword\"},
              \"title\": {\"type\":\"text\", \"analyzer\":\"my_nori_analyzer\"},
              \"pub_date\": {\"type\":\"date\"},
              \"company_name\": {\"type\":\"keyword\"},
              \"url\": {\"type\":\"keyword\"},
              \"summarized_text\": {\"type\":\"text\", \"analyzer\":\"my_nori_analyzer\"},
              \"hashtags\": {
                \"type\":\"text\",
                \"fields\": {
                  \"keyword\": {
                    \"type\":\"keyword\"
                  }
                }
              },
              \"created_at\": {\"type\":\"date\"}
            }
          }
        }"
      '
    volumes:
      - ./certs:/certs
    networks:
      - elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:8.7.1
    container_name: kibana
    ports:
      - 5601:5601
    environment:
      - KIBANA_HOST=0.0.0.0  
      - ELASTICSEARCH_HOSTS=https://${DNS_NAME}:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
      - ./certs:/usr/share/kibana/config/certs
    networks:
      - elastic
    depends_on:
      elasticsearch:
        condition: service_healthy
    
networks:
  elastic:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local
